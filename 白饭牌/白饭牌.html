<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>白饭牌 · 单机版</title>
<style>
  :root {
    --bg: #0f1216;
    --bg-soft: #161b22;
    --panel: #1c2230;
    --panel-2: #232b3b;
    --line: #2f3948;
    --text: #e6ebf2;
    --muted: #93a1b5;
    --accent: #4ea1ff;
    --accent-2: #ffb347;
    --danger: #ff6b6b;
    --ok: #48d597;
    --card-plain: #f4f6fa;
    --card-plain-text: #1b2029;
    --radius: 12px;
    --shadow: 0 6px 18px rgba(0, 0, 0, 0.35);
  }

  * { box-sizing: border-box; }

  /* hidden 属性必须始终生效：任何 .foo { display: ... } 都会盖过浏览器默认的
     [hidden] { display: none }，所以这里用 !important 兜住，
     避免"JS 设了 hidden 但界面上还在"的问题。 */
  [hidden] { display: none !important; }

  body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(1200px 700px at 50% -10%, #1b2433 0%, var(--bg) 60%);
    color: var(--text);
    font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  button { font-family: inherit; }

  .app {
    max-width: 1180px;
    margin: 0 auto;
    padding: 14px 16px 28px;
    display: grid;
    grid-template-columns: minmax(0, 1fr) 320px;
    grid-template-areas:
      "header header"
      "board side"
      "hand side";
    gap: 12px 16px;
  }

  header { grid-area: header; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  h1 { font-size: 20px; margin: 0; letter-spacing: 1px; }
  .subtitle { color: var(--muted); font-size: 12.5px; }

  .badge {
    font-size: 12px; padding: 3px 9px; border-radius: 999px;
    border: 1px solid var(--line); color: var(--muted); background: var(--panel);
  }
  .badge.turn { color: #0d1117; background: var(--accent-2); border-color: transparent; font-weight: 700; }
  .badge.lock { color: #f5e9ff; background: linear-gradient(135deg, #7c3aed, #a855f7); border-color: transparent; }
  .badge.magic { color: #0d1117; background: linear-gradient(135deg, #7dd3fc, #38bdf8); border-color: transparent; }
  .badge.mode { color: #cfe0f5; background: rgba(78,161,255,.16); border-color: rgba(78,161,255,.45); }

  .board { grid-area: board; }
  .board-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }

  .column {
    background: linear-gradient(180deg, var(--panel), var(--bg-soft));
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 10px;
    min-height: 230px;
    display: flex; flex-direction: column; gap: 8px;
    transition: border-color .15s, box-shadow .15s, transform .15s;
  }
  .column.clickable { cursor: pointer; }
  .column.legal { border-color: rgba(72,213,151,.55); }
  /* 选中某张牌后，这张牌放不了的列变暗，避免"点了没反应"的困惑 */
  .column.not-for-selected {
    opacity: .42;
    border-style: dashed;
  }
  .column.selected { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(78,161,255,.35); }
  .column.banned { border-color: rgba(255,107,107,.6); }
  .column-head { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: var(--muted); }
  .column-head b { color: var(--text); font-size: 12.5px; }

  /* ---- 牌堆：只露出牌头的叠放，点一下看完整信息 ---- */
  .fanned {
    position: relative;
    margin-top: auto;
    margin-bottom: 2px;
    display: flex;
    flex-direction: column;
    align-items: center;
    cursor: pointer;
    padding-top: 20px; /* 给"共 N 张"留位置 */
  }
  .fanned .fanned-card { line-height: 0; }
  .fanned:hover .card-strip { outline: 1px solid rgba(255,255,255,.35); }
  .fanned .stack-depth {
    position: absolute; top: 0; left: 50%; transform: translateX(-50%);
    font-size: 11px; color: var(--muted); white-space: nowrap;
    background: var(--bg-soft); border: 1px solid var(--line);
    border-radius: 999px; padding: 1px 8px;
  }
  .fanned .top-flag {
    position: absolute; right: 0; top: 0;
    font-size: 9.5px; color: var(--accent);
    background: rgba(78,161,255,.14); border: 1px solid rgba(78,161,255,.4);
    border-radius: 999px; padding: 1px 6px;
  }

  .empty-slot {
    border: 1px dashed var(--line); border-radius: 8px; color: var(--muted);
    font-size: 12px; padding: 14px; text-align: center;
  }
  .stack-hint { font-size: 11px; color: var(--muted); text-align: center; }
  .column.tall .fanned { justify-content: flex-start; }

  .card {
    width: 58px; height: 80px; border-radius: 9px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-weight: 800; user-select: none; position: relative;
    border: 1px solid rgba(255,255,255,.14);
    box-shadow: var(--shadow);
    transition: transform .12s, box-shadow .12s, border-color .12s;
  }
  .card .rank { font-size: 26px; line-height: 1; }
  .card .kind { font-size: 9.5px; font-weight: 600; opacity: .8; margin-top: 3px; letter-spacing: .5px; }
  .card.small { width: 46px; height: 64px; }
  .card.small .rank { font-size: 20px; }
  .card.mini { width: 40px; height: 54px; }
  .card.mini .rank { font-size: 17px; }
  .card.mini .kind { font-size: 8px; }

  /* 叠放用的牌条：无论被压住多少，牌头永远露在外面 */
  .card-strip {
    width: 46px; height: 54px; border-radius: 7px;
    border: 1px solid rgba(255,255,255,.16);
    box-shadow: 0 2px 6px rgba(0,0,0,.45);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 5px; user-select: none; overflow: hidden;
  }
  .card-strip .strip-rank { font-size: 16px; font-weight: 800; line-height: 1; }
  .card-strip .strip-kind { font-size: 9px; opacity: .85; letter-spacing: .3px; }
  .card-strip.theme-plain { background: var(--card-plain); color: var(--card-plain-text); }
  .card-strip.theme-purple { background: linear-gradient(120deg, #a78bfa, #7c3aed); color: #fff; }
  .card-strip.theme-black { background: linear-gradient(120deg, #2b3038, #0b0d11); color: #fff; border-color: #4b5563; }
  .card-strip.theme-light { background: linear-gradient(120deg, #fef3c7, #fbbf24); color: #3b2a05; }
  .card-strip.theme-dark { background: linear-gradient(120deg, #6b4b2a, #2f1f10); color: #ffe9c7; }
  .card-strip.theme-magic-light { background: linear-gradient(120deg, #bae6fd, #38bdf8); color: #06283d; }
  .card-strip.theme-magic-dark { background: linear-gradient(120deg, #4c1d95, #1e1b4b); color: #ddd6fe; }
  .card-strip.is-top { box-shadow: 0 8px 18px rgba(0,0,0,.55), 0 0 0 1.5px rgba(78,161,255,.65); }

  .card.theme-plain { background: var(--card-plain); color: var(--card-plain-text); }
  .card.theme-purple { background: linear-gradient(160deg, #a78bfa, #7c3aed); color: #fff; }
  .card.theme-black { background: linear-gradient(160deg, #2b3038, #0b0d11); color: #fff; border-color: #4b5563; }
  .card.theme-light { background: linear-gradient(160deg, #fef3c7, #fbbf24); color: #3b2a05; }
  .card.theme-dark { background: linear-gradient(160deg, #6b4b2a, #2f1f10); color: #ffe9c7; }
  .card.theme-magic-light { background: linear-gradient(160deg, #bae6fd, #38bdf8); color: #06283d; }
  .card.theme-magic-dark { background: linear-gradient(160deg, #4c1d95, #1e1b4b); color: #ddd6fe; }

  .hand-area { grid-area: hand; }
  .hand-panel {
    background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 10px 12px; display: flex; flex-direction: column; gap: 8px;
  }

  /* ---- 技能面板 ---- */
  .skill-box { display: flex; flex-direction: column; gap: 8px; }
  .skill-card {
    border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px;
    background: var(--bg-soft); display: flex; flex-direction: column; gap: 5px;
  }
  .skill-card.mine { border-color: rgba(78,161,255,.45); background: rgba(78,161,255,.07); }
  .skill-card.usable { border-color: rgba(72,213,151,.6); box-shadow: 0 0 0 1px rgba(72,213,151,.25); }
  .skill-head { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .skill-name { font-size: 13.5px; font-weight: 700; }
  .skill-owner { font-size: 11px; color: var(--muted); }
  .skill-tag {
    font-size: 10.5px; padding: 1px 6px; border-radius: 999px;
    border: 1px solid var(--line); color: var(--muted); margin-left: auto;
  }
  .skill-tag.active { color: #b9f5d8; border-color: rgba(72,213,151,.5); }
  .skill-tag.used { color: #ffc9c9; border-color: rgba(255,107,107,.45); }
  .skill-text { font-size: 11.5px; color: var(--muted); line-height: 1.55; }
  /* 威严专属：发动中 / 已失效 */
  .skill-state {
    font-size: 11.5px; line-height: 1.5; border-radius: 6px; padding: 4px 7px;
  }
  .skill-state.on {
    color: #fde68a; background: rgba(251,191,36,.12); border: 1px solid rgba(251,191,36,.5);
  }
  .skill-state.off {
    color: var(--muted); background: rgba(148,163,184,.10); border: 1px solid rgba(148,163,184,.35);
  }
  .skill-card.live { border-color: rgba(251,191,36,.55); }
  .skill-actions { display: flex; gap: 6px; flex-wrap: wrap; }
  /* 看破：看过的对方手牌 */
  .reveal-box {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    border: 1px solid rgba(125,211,252,.45); background: rgba(56,189,248,.10);
    border-radius: 10px; padding: 6px 10px; font-size: 12px; color: #bae6fd;
  }
  .reveal-box .reveal-title { color: #7dd3fc; white-space: nowrap; }
  .reveal-box .reveal-card {
    border: 1px solid rgba(125,211,252,.5); border-radius: 6px;
    padding: 1px 7px; color: #e0f2fe; background: rgba(2,132,199,.18);
  }
  .reveal-box .reveal-note { color: var(--muted); font-size: 11px; }
  .skill-actions .btn { font-size: 11.5px; padding: 4px 8px; }

  /* ---- 交互式选牌（观星 / 汇流） ---- */
  .choice-bar {
    border: 1px solid rgba(72,213,151,.55);
    background: linear-gradient(135deg, rgba(72,213,151,.16), rgba(16,185,129,.05));
    border-radius: 10px; padding: 10px 12px;
    display: flex; flex-direction: column; gap: 8px;
  }
  .choice-bar .choice-title { font-size: 13px; font-weight: 700; color: #b9f5d8; }
  .hand-row .card.picked { transform: translateY(-10px); box-shadow: 0 0 0 2px var(--ok), var(--shadow); }
  /* 选牌阶段：候选牌高亮，非候选（例如汇流里不是刚抽到的那几张）低亮 */
  .hand-row .card.pickable {
    box-shadow: 0 0 0 2px rgba(72,213,151,.55), var(--shadow);
    cursor: pointer;
  }
  .hand-row .card.out-of-pool { opacity: .32; filter: grayscale(.6); cursor: not-allowed; }

  /* 开局禁列：内嵌在操作区，不再用弹窗挡住手牌 */
  .ban-bar {
    border: 1px solid rgba(255,179,71,.55);
    background: linear-gradient(135deg, rgba(255,179,71,.16), rgba(255,179,71,.05));
    border-radius: 10px; padding: 10px 12px;
    display: flex; flex-direction: column; gap: 8px;
  }
  .ban-bar .ban-title { font-size: 13px; font-weight: 700; color: #ffd79a; }

  /* 当前生效的限制（魔法 / 紫 0 限锁 / 禁列）：做成显眼的横幅 */
  .act-bar {
    display: flex; align-items: flex-start; gap: 9px;
    border-radius: 10px; padding: 10px 12px;
    font-size: 13px; line-height: 1.6; font-weight: 600;
    border: 1px solid transparent;
  }
  .act-bar[hidden] { display: none; }
  .act-bar .act-icon { font-size: 15px; line-height: 1.3; }
  .act-bar.lock {
    color: #f0e2ff;
    background: linear-gradient(135deg, rgba(168,85,247,.32), rgba(124,58,237,.14));
    border-color: rgba(196,132,252,.7);
    box-shadow: 0 0 0 1px rgba(196,132,252,.25), 0 0 18px rgba(168,85,247,.25);
  }
  .act-bar.magic {
    color: #d4f0ff;
    background: linear-gradient(135deg, rgba(56,189,248,.3), rgba(14,165,233,.12));
    border-color: rgba(125,211,252,.7);
    box-shadow: 0 0 0 1px rgba(125,211,252,.25), 0 0 18px rgba(56,189,248,.22);
  }
  .act-bar.ban {
    color: #ffe3bd;
    background: linear-gradient(135deg, rgba(245,158,11,.28), rgba(180,83,9,.12));
    border-color: rgba(251,191,36,.7);
        box-shadow: 0 0 0 1px rgba(251,191,36,.22), 0 0 18px rgba(245,158,11,.2);
  }
  .act-bar.forced {
    color: #d9ffe9;
    background: linear-gradient(135deg, rgba(72,213,151,.28), rgba(16,185,129,.1));
    border-color: rgba(110,231,183,.7);
  }

  .hand-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 13px; }
  .hand-head .who { font-weight: 700; }
  .hand-row { display: flex; gap: 8px; flex-wrap: wrap; min-height: 84px; }
  .hand-row .card { cursor: pointer; }
  .hand-row .card:hover { transform: translateY(-6px); }
  .hand-row .card.selected { transform: translateY(-10px); box-shadow: 0 0 0 2px var(--accent), var(--shadow); }
  .hand-row .card.blocked { opacity: .38; cursor: not-allowed; }
  .hand-row .card.blocked:hover { transform: none; }

  .side { grid-area: side; display: flex; flex-direction: column; gap: 12px; }
  .panel {
    background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px;
  }
  .panel h2 { margin: 0 0 8px; font-size: 13px; color: var(--muted); font-weight: 700; letter-spacing: .5px; }
  .panel .row { display: flex; gap: 8px; flex-wrap: wrap; }
  .stat-line { display: flex; justify-content: space-between; font-size: 13px; padding: 3px 0; }
  .stat-line span:last-child { font-weight: 700; }

  button.btn {
    background: var(--panel-2); color: var(--text); border: 1px solid var(--line);
    border-radius: 9px; padding: 8px 12px; font-size: 13px; cursor: pointer; transition: .15s;
  }
  button.btn:hover:not(:disabled) { border-color: var(--accent); color: #fff; }
  button.btn:disabled { opacity: .45; cursor: not-allowed; }
  button.btn.primary { background: linear-gradient(135deg, #2f80ed, #4ea1ff); border-color: transparent; color: #04121f; font-weight: 700; }
  button.btn.warn { background: linear-gradient(135deg, #b45309, #f59e0b); border-color: transparent; color: #1b1200; font-weight: 700; }
  button.btn.ghost { background: transparent; }
  button.btn.sm { padding: 5px 9px; font-size: 12px; }

  .log { display: flex; flex-direction: column; gap: 4px; max-height: 220px; overflow-y: auto; font-size: 12px; }
  .log div { color: var(--muted); border-left: 2px solid var(--line); padding-left: 8px; }
  .log div.hi { color: var(--text); border-color: var(--accent); }
  .log div.bad { color: #ffc9c9; border-color: var(--danger); }
  .log div.good { color: #b9f5d8; border-color: var(--ok); }

  .hint-box {
    font-size: 12.5px; line-height: 1.65; color: #cfe0f5;
    background: linear-gradient(135deg, rgba(78,161,255,.12), rgba(78,161,255,.04));
    border: 1px solid rgba(78,161,255,.3); border-radius: 10px; padding: 9px 11px;
    white-space: pre-wrap;
  }

  .overlay {
    position: fixed; inset: 0; background: rgba(6, 9, 14, .78);
    display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 50;
    backdrop-filter: blur(4px);
  }
  .overlay[hidden] { display: none; }
  .modal {
    background: var(--panel); border: 1px solid var(--line); border-radius: 16px;
    padding: 22px; max-width: 560px; width: 100%; box-shadow: 0 20px 60px rgba(0,0,0,.5);
  }
  .modal h2 { margin: 0 0 6px; font-size: 22px; }
  .modal p { color: var(--muted); font-size: 13.5px; line-height: 1.7; margin: 6px 0 14px; }
  .diff-list { display: grid; gap: 8px; }
  .diff {
    display: flex; align-items: flex-start; gap: 10px; padding: 10px 12px;
    border: 1px solid var(--line); border-radius: 11px; cursor: pointer; transition: .15s;
  }
  .diff:hover { border-color: var(--accent); background: var(--panel-2); }
  .diff.selected { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(78,161,255,.28); }
  .diff .name { font-weight: 700; font-size: 14px; }
  .diff .desc { color: var(--muted); font-size: 12.5px; line-height: 1.55; }
  .section-label {
    font-size: 12px; color: var(--muted); font-weight: 700;
    letter-spacing: .5px; margin: 14px 0 8px;
  }

  .pile { display: flex; gap: 4px; flex-wrap: wrap; max-height: 130px; overflow-y: auto; }
  .pile .card.mini { width: 30px; height: 40px; }
  .pile .card.mini .rank { font-size: 13px; }
  .pile .card.mini .kind { display: none; }

  details.rules { font-size: 12.5px; color: var(--muted); line-height: 1.75; }
  details.rules summary { cursor: pointer; color: var(--text); font-weight: 600; margin-bottom: 6px; }
  details.rules li { margin-bottom: 4px; }

  /* 技能一览：名称 + 发动方式 + 原文效果 */
  .skill-list { display: flex; flex-direction: column; gap: 7px; }
  .skill-list .skill-item { border-left: 2px solid var(--line); padding-left: 8px; }
  .skill-list .skill-item b { color: var(--text); font-size: 12.5px; }
  .skill-list .skill-kind { font-size: 11px; color: var(--muted); margin-left: 6px; }
  .skill-list .skill-desc { display: block; font-size: 11.5px; color: var(--muted); }

  .build-stamp {
    text-align: center; color: #4b5768; font-size: 11px;
    padding: 0 0 16px; letter-spacing: .3px;
  }

  .trace-box {
    display: flex; flex-direction: column; gap: 3px;
    max-height: 200px; overflow-y: auto;
    font-size: 11px; line-height: 1.5; color: var(--muted);
  }
  .trace-box div { border-left: 2px solid var(--line); padding-left: 7px; }
  .trace-box div.bad { color: #ffc9c9; border-color: var(--danger); }

  /* 牌堆详情弹窗 */
  .col-detail { display: flex; flex-direction: column-reverse; gap: 6px; margin: 6px 0 4px; }
  .col-detail .detail-row {
    display: flex; align-items: center; gap: 10px;
    border: 1px solid var(--line); border-radius: 10px; padding: 7px 10px;
    background: var(--bg-soft);
  }
  .col-detail .detail-row.top { border-color: var(--accent); background: rgba(78,161,255,.1); }
  .col-detail .detail-text { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .col-detail .detail-name { font-size: 13.5px; font-weight: 700; }
  .col-detail .detail-blurb { font-size: 12px; color: var(--muted); }
  .col-detail .detail-order { font-size: 11px; color: var(--muted); margin-left: auto; white-space: nowrap; }

  @media (max-width: 900px) {
    .app { grid-template-columns: minmax(0, 1fr); grid-template-areas: "header" "board" "hand" "side"; }
  }
  @media (max-width: 520px) {
    .card { width: 48px; height: 68px; }
    .card .rank { font-size: 21px; }
    .card.small { width: 40px; height: 56px; }
  }
</style>
</head>
<body>
<div id="boot" data-boot="fail"></div>
<div class="app">
  <header>
    <h1>白饭牌 <span class="badge">单机版</span></h1>
    <span id="modeBadge" class="badge mode">人机对战</span>
    <span id="turnBadge" class="badge turn">准备开始</span>
    <span id="lockBadge" class="badge lock" hidden>紫 0 限锁中</span>
    <span id="magicBadge" class="badge magic" hidden></span>
    <span style="flex:1"></span>
    <button id="btnRules" class="btn sm ghost">规则</button>
    <button id="btnNew" class="btn sm">重开</button>
  </header>

  <main class="board">
    <div id="boardGrid" class="board-grid"></div>
  </main>

  <section class="hand-area">
    <div class="hand-panel">
      <div id="banBar" class="ban-bar" hidden>
        <div class="ban-title">你是后手：请指定 AI 第一手不能放的列</div>
        <div class="row" id="banRow"></div>
      </div>
      <div id="choiceBar" class="choice-bar" hidden>
        <div class="choice-title" id="choiceTitle"></div>
        <div class="row" id="choiceRow"></div>
      </div>
      <div id="actBar" class="act-bar" hidden>
        <span class="act-icon">⚠</span>
        <span id="actText"></span>
      </div>
      <div class="hand-head">
        <span class="who" id="myHandLabel">我的手牌</span>
        <span id="myCount" class="badge">5 张</span>
        <span style="flex:1"></span>
        <span id="oppInfo" class="subtitle"></span>
      </div>
      <div id="myHand" class="hand-row"></div>
      <div id="revealBox" class="reveal-box" hidden></div>

    // 基底那张牌本身不可被炸：当顶端就是基底时（列高 1）不允许放炸弹。
    if (stack.length <= 1) {
      return { ok: false, reason: '基底不可被炸，此列没有可炸的牌' };
    }
    if (card.color !== 'dark' && top.rank > 4) {
      return { ok: false, reason: '浅 E 只能炸 0-4（普通 5 炸不动）' };
    }
    return {
      ok: true,
      effect: { type: 'bomb', destroyedRank: top.rank, destroyedColor: top.color },
    };
  }

  if (isMagic(card)) {
    if (digitsOnly) {
      return { ok: false, reason: '紫 0 限锁生效：全场只能放数字牌' };
    }
    const top = topOf(state, col);
    if (!top) return { ok: false, reason: '空列没有数字，魔法需要放在数字牌上' };
    if (!isDigit(top)) return { ok: false, reason: '魔法需要放在数字牌上' };
    return {
      ok: true,
      effect: { type: 'magic', variant: isDark(card) ? 'dark' : 'light' },
    };
  }

  return { ok: false, reason: '未知卡牌类型' };
}

/**
 * 组合判定：牌本身能不能放 + 是否被下回合限制禁止。
 */
function canPlaceWithRestriction(state, player, col, card) {
  const base = canPlaceAt(state, player, col, card);
  if (!base.ok) return base;
  const blocked = restrictionBlocks(state, col, card, player);
  if (!blocked.ok) return blocked;
  return base;
}

/**
 * 枚举某个玩家当前的全部合法着法（永远包含"过牌"）。
 */
function legalActions(state, player = state.current) {
  const actions = [];
  const hand = state.hands[player] ?? [];
  for (let col = 0; col < COLUMNS; col++) {
    for (let handIndex = 0; handIndex < hand.length; handIndex++) {
      const card = hand[handIndex];
      const verdict = canPlaceWithRestriction(state, player, col, card);
      if (verdict.ok) {
        actions.push({ player, type: 'place', col, handIndex, card, effect: verdict.effect });
      }
    }
  }
  actions.push({
    player,
    type: 'pass',
    card: null,
    reason: actions.length > 0 ? '可放置但选择不放置' : '没有任何合法放置',
  });
  return actions;
}

/** 是否存在除过牌以外的合法着法。 */
function hasLegalPlacement(state, player = state.current) {
  return legalActions(state, player).some((a) => a.type === 'place');
}

/** 文案：着法的人类可读描述。 */
function describeAction(action, state) {
  if (!action) return '—';
  if (action.type === 'pass') return `过牌（${action.reason ?? ''}）`;
  const top = topOf(state, action.col);
  return `第 ${action.col + 1} 列（顶端 ${top ? top.rank : '空'}）放置 ${action.card.rank ?? ''}`;
}

/**
 * 技能注册表。
 *
 * 设计目标：加一个新技能 = 新增一个定义并注册，不用改引擎主流程。
 *
 * 每个技能定义可提供以下钩子（全部可选）：
 *   onGameStart(ctx, state)            开局时执行一次（在选技之后、禁列之前）
 *   extraActions(ctx, state, player)   提供额外的合法着法（主动技）
 *   applyAction(ctx, state, action)    执行自己的着法（就地修改传入的 state）
 *   applyChoice(ctx, state, choice)    执行"选牌"结果（就地修改传入的 state）
 *   legalKinds(ctx, state, player)     额外禁止某些牌型（例如威严）
 *   drawOnPass(ctx, state, player)     过牌时的抽牌方案
 *   onPlaced(ctx, state, action)       某张牌落桌后触发（例如荆棘）
 *   onTurnEnd(ctx, state, player)      回合结束时触发
 *
 * 约定：钩子直接修改传入的 state（引擎已经为这一次着法克隆好了新状态），
 * 返回值只在需要"追加信息"时使用。
 */

/** @typedef {{id:string, name:string, type:'active'|'passive', maxUses:number, text:string, hooks:object}} SkillDef */

const registry = new Map();

/** 注册一个技能。 */
function defineSkill(def) {
  if (!def || !def.id) throw new Error('技能定义必须有 id');
  if (registry.has(def.id)) throw new Error(`技能 id 重复：${def.id}`);
  registry.set(def.id, {
    type: def.type ?? 'passive',
    maxUses: def.maxUses ?? (def.type === 'active' ? 1 : 0),
    hooks: def.hooks ?? {},
    ...def,
  });
  return def.id;
}

/** 取技能定义。 */
function getSkill(id) {
  return registry.get(id) ?? null;
}

/** 全部技能 id（按注册顺序，供随机抽取与测试使用）。 */
function allSkillIds() {
  return [...registry.keys()];
}

/** 全部技能定义。 */
function allSkills() {
  return [...registry.values()];
}

/** 用给定随机源打乱技能 id 列表（供开局随机抽候选）。 */
function shuffleSkillIds(ids, rng) {
  const out = [...ids];
  for (let i = out.length - 1; i > 0; i--) {
    const j = rng.int(i + 1);
    const tmp = out[i];
    out[i] = out[j];
    out[j] = tmp;
  }
  return out;
}

/**
 * 把一条技能 id 列表整理成可供引擎查询的"技能上下文"。
 *
 * 优先级：紫 0 全局限锁 > 禁列 > 下回合限制 > 技能 > 常规规则。
 * 技能之间冲突时按座位顺序结算（先手优先），所以这里按 (先手, 后手) 排序。
 */
function skillsContext(skillIds) {
  const entries = [];
  const consider = (player) => {
    const id = skillIds?.[player];
    const skill = id ? getSkill(id) : null;
    if (skill) entries.push({ player, skill });
  };
  consider(0);
  consider(1);
  return {
    entries,
    has(skillId) {
      return entries.some((e) => e.skill.id === skillId);
    },
    of(player) {
      return entries.filter((e) => e.player === player).map((e) => e.skill);
    },
  };
}

/** 只给测试用：清空注册表（正常游戏流程不会调用）。 */
function _clearRegistry() {
  registry.clear();
}

/**
 * 九个技能的实现。
 *
 * 与引擎的接口约定（由 game.js 保证）：
 *   - 钩子里的 state 已经是"本次着法的克隆体"，可以直接就地修改。
 *   - 主动技通过 extraActions 提供着法，通过 applyAction 执行。
 *   - 需要玩家选牌的技能用 setPendingChoice 挂起，等 chooseCard 着法回来再 applyChoice。
 *   - 技能优先级低于紫 0 限锁与禁列：那两项由 rules.js 判定，技能只做"额外的限制"。
 *
 * 规则裁定（来自需求确认）：
 *   - 弃牌 = 已出局（复用 outOfPlay，不新增区域）
 *   - 消却不能移除基底（该列只剩基底时不可选）
 *   - 睡眠不算过牌：双方都不抽牌；但为避免僵局，仍计入"连续跳过"用于结算

/** 该列是否"只剩基底"（基底不可被炸，也不可被消却）。 */
const onlyBase = (state, col) => state.bases[col].length <= 1;

// ---------------------------------------------------------------------------

  hooks: {

  },
});

// 观星：开局随机拿走对方 2 张手牌，然后交 2 张手牌给对方
// ---------------------------------------------------------------------------
defineSkill({
  id: 'guanxing',
  name: '观星',
  type: 'passive',
  maxUses: 0,
  text: '游戏开始时，你随机获得对方 2 张牌，然后选择 2 张手牌交给对方。',
  hooks: {
    /**
     * 开局：
     *   1. 从对方手里随机抽走 2 张，放进自己手里（相当于"抢"）→ 自己 7 张、对方 3 张；
     *   2. 挂起选牌，让发动者从这 7 张里挑 2 张交给对方。
     * 一进一出正好 2 张，双方手牌数回到 5，只是把对方的 2 张换成了自己的 2 张。
     */
    onGameStart(_ctx, state, player, api, rng) {
      const target = 1 - player;
      const taken = [];
      const times = Math.min(2, state.hands[target].length);
      for (let i = 0; i < times; i++) {
        const size = state.hands[target].length;
        const index = rng && typeof rng.int === 'function' ? rng.int(size) : Math.floor(Math.random() * size);
        taken.push(state.hands[target].splice(index, 1)[0]);
      }
      state.hands[player].push(...taken);
      state.lastGuanxing = { by: player, taken: taken.map((c) => ({ ...c })) };

      api.setPendingChoice(state, {
        player,
        kind: 'giveToOpponent',
        count: 2,
        picked: [],
        // 标记为"开局阶段的选牌"：引擎不会把它当成一个回合
        //（否则会吃掉先手第一手，并让禁列判定失效）
        phase: 'opening',
        ready: false,
        note: '观星：选择 2 张手牌交给对方',
      });
    },
    applyChoice(_ctx, state, choice) {
      const target = 1 - choice.player;
      for (const id of choice.cardIds) {
        const index = state.hands[choice.player].findIndex((c) => c.id === id);
        if (index < 0) continue;
        state.hands[target].push(state.hands[choice.player].splice(index, 1)[0]);
      }
      state.pendingChoice = null;
      return true;
    },
    /**
     * 观星需要"一次选 2 张"，所以这里把候选全部标出来，
     * 引擎会在选牌时校验选中的张数是否等于 count。
     */
    requiredCount() {
      return 2;
    },
  },
});

  text: '你过牌时，如果牌堆还有牌，改为你抽 3 张牌，然后选择这 3 张牌中的一张牌交给对手。',
  hooks: {
    drawOnPass(_ctx, state, player) {
      if (state.skills?.[player] !== 'huiliu') return null;
      if (state.deck.length === 0) return null;
      // 抽 3 张；不足 3 张时按实际数量抽
      return { self: Math.min(3, state.deck.length), opponent: 0, thenGiveOne: true };
    },
    /**
     * 过牌抽完之后挂起"从刚抽的 3 张里交一张给对手"的选择。
     * 关键区别（相对旧版）：候选只限**这次抽到的牌**，不能从整副手牌里挑垃圾送人——
     * 那正是让汇流强度失控的那条路径。
     */
    afterPassDraw(_ctx, state, player, api, plan) {
      if (!plan || !plan.thenGiveOne) return false;
      const hand = state.hands[player] ?? [];
      // 刚抽到的牌 = 手牌末尾的 plan.self 张（drawCards 是 push 进手牌）
      const drawnIds = hand.slice(Math.max(0, hand.length - plan.self)).map((c) => c.id);
      if (drawnIds.length === 0) return false;
      api.setPendingChoice(state, {
        player,
        kind: 'giveToOpponent',
        count: 1,
        picked: [],
        // 只允许从这次抽到的牌里选
        candidateIds: drawnIds,
        ready: false,
        note: '汇流：从刚抽到的 3 张里选 1 张交给对手',
      });
      return true;
    },
    applyChoice(_ctx, state, choice, api) {
      const picked = choice.cardIds[0];
      const allowed = choice.candidateIds ?? null;
      if (allowed && !allowed.includes(picked)) return false;
      const card = api.takeFromHand(state, choice.player, picked);
      if (card) state.hands[1 - choice.player].push(card);
      state.pendingChoice = null;
      return true;
    },
  },
});

/**
 * 某个数字牌"别人能接到它上面"的落点数（越小越卡手）。
 *
 * 数学参考（本报告里的实测口径）：
 *   0 → 6 张（任何 4/5/黑 5 都能接 0，加上 0 自己那一档）
 *   1 → 5 张
 *   2 → 9 张
 *   3 / 4 / 5 → 8 张
 * 注意这是"牌库里有几张牌能压住它"，因此在给定牌面下更准确的算法是
 * 直接数当前列顶允许接它的列数（见 scoreCardForOpponent）。
 */
const LANDING_SPOTS = Object.freeze({ 0: 6, 1: 5, 2: 9, 3: 8, 4: 8, 5: 8 });

/**
 * 某个数字在当前牌面上有几个落点（有多少列顶端能接它）。
 * 越小越"卡手"——这是"塞给对手哪张牌最难受"的核心指标。
 */
function countLandingSpots(state, rank) {
  let count = 0;
  for (const stack of state.bases ?? []) {
    const top = stack[stack.length - 1];
    if (!top || top.kind !== 'number') continue;
    if (allowedRanksOn(top).includes(rank)) count += 1;
  }
  return count;
}

/**
 * 挑一张"最适合塞给对手"的牌（汇流的交牌 / 创生的造牌共用）。
 *
 * 优先级：
 *   1. 当前场上**实际放不出去**的普通数字牌（落点数为 0）——塞给对手就是纯负担；
 *   2. 紫 0 限锁生效时，E/M 也打不出去，这时优先给 E/M；
 *   3. 否则按"当前落点数"从少到多给普通数字牌（落点越少越卡手）；
 *   4. 都不适用时，退回静态落点数表（越少越优先）。
 *
 * @param {object} state
 * @param {Array} cards 候选牌
 * @returns {object|null} 选中的牌
 */
function pickWorstCardForOpponent(state, cards) {
  if (!cards || cards.length === 0) return null;

  const scored = cards.map((card) => {
    if (card.kind !== 'number') {
      // E/M：平时留着（对对手有用），紫 0 限锁下反而变成废牌
      return { card, score: hasPurpleLock(state) ? -100 : 100 };
    }
    const spots = countLandingSpots(state, card.rank);
    return { card, score: spots * 10 + (LANDING_SPOTS[card.rank] ?? 8) };
  });

  scored.sort((a, b) => a.score - b.score);
  return scored[0].card;
}

// ---------------------------------------------------------------------------
// 供引擎使用的小工具（放在技能模块里，避免污染引擎）
// ---------------------------------------------------------------------------

/** 某玩家是否拥有某个技能。 */
const hasSkill = (state, player, skillId) => state.skills?.[player] === skillId;

/** 找出"拥有指定技能"的玩家（没有则 -1）。 */
function holderOf(state, skillId) {
  if (!state.skills) return -1;
  return state.skills.findIndex((id) => id === skillId);
}

// ─── src/engine/game.js ──────────────────────────────────────────
/**
 * 游戏状态机：创建对局、执行着法、判定胜负。
 *
 * 设计约定：
 *  - applyAction 永不修改传入的 state，总是返回全新的 state（浅层结构化克隆）。
 *  - 所有随机来源于外部注入的 RandomSource，因此对局可完整复现。
 *  - 引擎是纯逻辑，不依赖 DOM / 计时器 / 网络，可无头运行。
 *
 * 技能系统：
 *  - state.skills 记录每人的技能 id；技能通过 src/skills/registry.js 的钩子接入。
 *  - 着法类型：place（放牌）、pass（过牌）、skill（主动技）、chooseCard（交互式选牌）。
 *  - 优先级：紫 0 全局限锁 > 禁列 > 下回合限制 > 技能 > 常规规则。
 */




// 技能定义必须随引擎一起加载：否则 allSkillIds() 为空，选技阶段会拿到 0 个候选。
// （曾经因为漏了这行，只有显式 import 过 skills.js 的测试才能跑技能模式。）

const PLAYERS = Object.freeze([0, 1]);
const DEFAULT_TURN_LIMIT = 900;
/** 记录最近若干手，供 AI 判断"谁在推进局面"。 */
const HISTORY_LIMIT = 8;
/** 开局随机给出的候选技能数量。 */
const DRAFT_OPTIONS = 3;

const other = (player) => 1 - player;

/**
 * @typedef {object} GameState
 * @property {Array} deck                 抽牌堆
 * @property {Array<Array>} bases         3 列牌堆（每列自下而上）
 * @property {Array<Array>} hands         两名玩家的手牌
 * @property {Array} outOfPlay            已移出游戏的牌（弃牌也放这里）
 * @property {number} current             当前行动方
 * @property {number} turn                回合序号（从 1 开始）
 * @property {number} firstPlayer         先手
 * @property {Array<string|null>} skills  每人选定的技能 id
 * @property {Array<number>} skillUses    每人已使用主动技的次数（按玩家记，不是按技能）
 * @property {Array<number>} usesById     记录每个技能已用次数（用于"每局限 N 次"）
 * @property {Array<number>} emPlaced     每人已放置的 E/M 张数（威严用）
 * @property {Array<{turn:number, cardId:string|null}>} lastDigit 每人最近放置的数字牌
 * @property {{options: string[], picks: Array<number|null>}|null} draft 选技阶段
 * @property {{player:number, kind:string, count:number, ready:boolean, note:string}|null} pendingChoice
 * @property {object} restriction         作用于"当前行动方本回合"的下回合限制
 */

/**
 * 状态构造的唯一入口：createGame、clone、以及各处"补字段"都走这里。
 * 以后新增状态字段只需要改这一个函数，不会出现"某处克隆漏了字段"的问题。
 */
function newState(base = {}) {
  const firstPlayer = base.firstPlayer ?? 0;
  return {
    version: base.version ?? 0,
    deck: base.deck ? base.deck.slice() : [],
    bases: base.bases ? base.bases.map((stack) => stack.slice()) : [],
    hands: base.hands ? [base.hands[0].slice(), base.hands[1].slice()] : [[], []],
    outOfPlay: base.outOfPlay ? base.outOfPlay.slice() : [],
    current: base.current ?? firstPlayer,
    turn: base.turn ?? 1,
    firstPlayer,
    lastPlayer: base.lastPlayer ?? other(firstPlayer),
    forbiddenColumn: base.forbiddenColumn ?? null,
    restriction: base.restriction ? { ...base.restriction } : noRestriction(),
    // 每个玩家一个独立的下回合限制槽：互不覆盖，同一个人可以同时背多条
    restrictions: Array.isArray(base.restrictions)
      ? [base.restrictions[0].map((r) => ({ ...r })), base.restrictions[1].map((r) => ({ ...r }))]
      : [[], []],
    consecutivePasses: base.consecutivePasses ?? 0,
    history: base.history ? base.history.slice() : [],
    turnLimit: base.turnLimit ?? DEFAULT_TURN_LIMIT,
    result: base.result ? { ...base.result } : { over: false, winner: null, reason: null },
    lastAction: base.lastAction ?? null,
    // ---- 技能相关 ----
    skills: base.skills ? [...base.skills] : [null, null],
    skillUses: base.skillUses ? [...base.skillUses] : [0, 0],
    usesById: base.usesById ? { ...base.usesById } : {},
    emPlaced: base.emPlaced ? [...base.emPlaced] : [0, 0],
    lastDigit: base.lastDigit
      ? base.lastDigit.map((entry) => (entry ? { ...entry } : null))
      : [null, null],
    draft: base.draft
      ? {
        options: [...(base.draft.options ?? [])],
        available: [...(base.draft.available ?? base.draft.options ?? [])],
        order: [...(base.draft.order ?? [])],
        picks: [...(base.draft.picks ?? [])],
      }
      : null,
    pendingChoice: base.pendingChoice ? { ...base.pendingChoice } : null,
    // 创生造出来的牌（不属于牌库的 37 张）：登记在这里，牌数守恒检查把它算进去
    createdCards: base.createdCards ? base.createdCards.map((c) => ({ ...c })) : [],
    // 观星开局抢到的牌（仅用于调试/展示，不影响规则判定）
    lastGuanxing: base.lastGuanxing ? { ...base.lastGuanxing } : null,
  };
}

function buildDeckState(rng) {
  const deck = shuffle(createDeck(), rng);
  const bases = [];
  for (let i = 0; i < BASE_COUNT; i++) {
    // 基底只从"数字牌"里抽（普通 0-5 / 紫 0 / 黑 5 都可以）。
    const index = deck.findIndex((c) => isDigit(c));
    bases.push([deck.splice(index, 1)[0]]);
  }
  const hands = [[], []];
  for (let i = 0; i < HAND_SIZE; i++) {
    for (const p of PLAYERS) hands[p].push(deck.pop());
  }
  return { deck, bases, hands };
}

/**
 * 开新局。
 * @param {{seed?: number|string, rng?: object, firstPlayer?: number, lastPlayer?: number,
 *          turnLimit?: number, bases?: Array, hands?: Array, deck?: Array,
 *          withSkills?: boolean, skills?: Array<string|null>}} [options]
 *
 * withSkills 为 true 时进入"选技阶段"：随机抽 DRAFT_OPTIONS 个技能，由后手先选。
 */
function createGame(options = {}) {
  const rng = options.rng ?? createRng(typeof options.seed === 'string' ? hashSeed(options.seed) : (options.seed ?? Date.now()));
  const draw = options.deck && options.bases && options.hands
    ? { deck: options.deck, bases: options.bases, hands: options.hands }
    : buildDeckState(rng);
  const firstPlayer = options.firstPlayer ?? rng.int(2);
  const lastPlayer = options.lastPlayer ?? other(firstPlayer);

  const state = newState({
    ...draw,
    firstPlayer,
    lastPlayer,
    turnLimit: options.turnLimit ?? DEFAULT_TURN_LIMIT,
  });

  if (options.skills) {
    // 直接指定技能（测试与"固定阵容"模式用），跳过选技阶段。
    state.skills = [options.skills[0] ?? null, options.skills[1] ?? null];
    runGameStartHooks(state, rng);
    // 开局钩子可能挂起交互式选牌（观星）：把行动权交给需要选牌的人
    if (state.pendingChoice) state.current = state.pendingChoice.player;
    return state;
  }

  if (options.withSkills) {
    const candidates = shuffleSkillIds(allSkillIds(), rng).slice(0, DRAFT_OPTIONS);
    state.draft = {
      options: candidates,
      // available 是"还没被选走"的候选：每有一人选走就从这里移除，
      // 保证同一个技能不会被两人同时拿到。
      available: [...candidates],
      // 后手先选：order 是"选择顺序"（玩家号），picks 按顺序追加已选玩家
      order: [lastPlayer, firstPlayer],
      picks: [],
    };
    state.current = lastPlayer;
  }
  return state;
}

function hashSeed(text) {
  let h = 2166136261 >>> 0;
  for (let i = 0; i < text.length; i++) {
    h ^= text.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return h >>> 0;
}

/** 后手指定"先手第一手禁放"的列。 */
function setForbiddenColumn(state, col) {
  if (state.forbiddenColumn !== null || state.result.over) return state;
  if (!Number.isInteger(col) || col < 0 || col >= COLUMNS) throw new Error(`非法列：${col}`);
  const next = { ...newState(state), forbiddenColumn: col };
  next.version = state.version + 1;
  return next;
}

/** 给后手 AI 选禁放列：简单启发式，避免在对手刚开局时白送一列。 */
function suggestForbiddenColumn(state) {
  let best = 0;
  let bestScore = -Infinity;
  for (let col = 0; col < COLUMNS; col++) {
    const top = topOf(state, col);
    const score = top ? (top.rank >= 2 && top.rank <= 4 ? 2 : top.rank <= 1 ? 1 : 0.5) : 0;
    if (score > bestScore) {
      bestScore = score;
      best = col;
    }
  }
  return best;
}

function clone(state) {
  return newState(state);
}

function drawCards(state, player, count) {
  const drawn = [];
  for (let i = 0; i < count && state.deck.length > 0; i++) {
    const card = state.deck.pop();
    state.hands[player].push(card);
    drawn.push(card);
  }
  return drawn;
}

// ---------------------------------------------------------------------------
// 技能接入
// ---------------------------------------------------------------------------

/** 当前技能上下文（按先手优先排序，技能冲突时先手先生效）。 */
function skillContextOf(state) {
  return skillsContext(state.skills ?? [null, null]);
}

/**
 * 某玩家本回合允许放置的牌型；返回 null 表示不额外限制。
 *
 * 注意：这里只处理"技能带来的额外禁牌"（例如威严）与紫 0 全局限锁。
 * "下回合限制只许放数字牌"不在这里处理——那条属于限制层，
 * 由 legalActions 统一做限制过滤。
 */
function legalKindsFor(state, player) {
  if (hasPurpleLock(state)) return ['number'];
  // 限制层整类禁掉的牌型（沉默：本回合不能放 E/M）。
  // 可能同时有多条这类限制，取并集。
  const banned = new Set();
  for (const restriction of restrictionsFor(state, player)) {
    for (const kind of restriction.forbidKinds ?? []) banned.add(kind);
  }
  if (banned.size > 0) {
    return ['number', 'e', 'm'].filter((k) => !banned.has(k));
  }
  const context = skillContextOf(state);
  for (const entry of context.entries) {
    const hook = entry.skill.hooks.legalKinds;
    if (!hook) continue;
    const kinds = hook(context, state, player, entry.player);
    if (kinds) return kinds;
  }
  return null;
}

/** 某个玩家本回合是否被禁止使用主动技能（沉默）。 */
function skillsForbidden(state, player = state.current) {
  return restrictionsFor(state, player).some((r) => r.forbidSkills === true);
}

/** 某玩家当前的全部合法着法（含普通着法与主动技）。 */
function playerActions(state, player = state.current) {
  if (state.pendingChoice) {
    const choice = state.pendingChoice;
    if (choice.player !== player) return [{ player, type: 'pass', card: null, reason: '等待对方选牌' }];
    // 候选来自"持牌者"的手牌（观星是自己、汇流是发动者）。
    // candidateIds 可以进一步把候选限定成"其中一部分"（汇流：只能交刚抽到的牌）。
    const hand = state.hands[choice.player] ?? [];
    const allowed = choice.candidateIds
      ? hand.filter((c) => choice.candidateIds.includes(c.id))
      : hand;
    const picked = new Set(choice.picked ?? []);
    const need = (choice.count ?? 1) - picked.size;
    const actions = [];

    if (need > 1) {
      // 需要选多张：逐张选，选满后再确认
      for (const card of allowed) {
        if (picked.has(card.id)) continue;
        actions.push({ player, type: 'chooseCard', card, cardId: card.id, pending: true });
      }
      if (picked.size === (choice.count ?? 1)) {
        actions.push({ player, type: 'confirmChoice', card: null, cardIds: [...picked] });
      }
      return actions;
    }

    // 只差一张（或本来就只需一张）：直接选完即生效
    for (const card of allowed) {
      if (picked.has(card.id)) continue;
      actions.push({ player, type: 'chooseCard', card, cardId: card.id });
    }
    return actions;
  }

  const context = skillContextOf(state);
  const kinds = legalKindsFor(state, player);
  const actions = legalActions(state, player).filter((action) => {
    if (action.type === 'pass') return true;
    // 技能对"可放牌型"的额外限制（例如威严）
    return !kinds || kinds.includes(action.card.kind);
  });

  if (state.result.over || player !== state.current) return actions;

  // 沉默这类限制会禁用主动技能：整段"主动技着法"都不生成
  if (skillsForbidden(state, player)) return actions;

  for (const entry of context.entries) {
    if (entry.player !== player) continue;
    const skill = entry.skill;
    const used = state.usesById[skill.id] ?? 0;
    if (skill.type !== 'active' || used >= skill.maxUses) continue;
    const hook = skill.hooks.extraActions;
    if (!hook) continue;
    for (const action of hook(context, state, player) ?? []) {
      let expanded = [action];
      if (action.needsCard) {
        // 需要指定一张手牌：为每张手牌生成一个着法
        expanded = state.hands[player].map((card, handIndex) => ({
          ...action,
          handIndex,
          card,
          label: `${action.label}（${cardNameSafe(card)}）`,
        }));
      }
      actions.push(...expanded.map((a) => ({ ...a, skill: skill.id, usesLeft: skill.maxUses - used })));
    }
  }
  return actions;
}

/** 卡面名称（避免 game.js 直接依赖 UI 文案，这里用简短形式）。 */
function cardNameSafe(card) {
  if (!card) return '?';
  if (isDigit(card)) {
    if (card.color === 'purple') return '紫0';
    if (card.color === 'black') return '黑5';
    return String(card.rank);
  }
  return `${card.color === 'dark' ? '深' : '浅'}${isBomb(card) ? 'E' : 'M'}`;
}

/** 是否存在除过牌以外的合法着法。 */
function canAct(state, player = state.current) {
  return playerActions(state, player).some((a) => a.type !== 'pass');
}

/** 技能提供的抽牌方案（过牌时）。 */
function drawPlanFor(state, player) {
  for (const entry of skillContextOf(state).entries) {
    if (entry.player !== player) continue;
    const hook = entry.skill.hooks.drawOnPass;
    if (!hook) continue;
    const plan = hook(skillContextOf(state), state, player);
    if (plan) return plan;
  }
  return null;
}

/** 挂起一个交互式选牌请求。 */
function setPendingChoice(state, request) {
  state.pendingChoice = { ready: false, ...request };
}

/** 从手牌里取走一张（按 id）。 */
function takeFromHand(state, player, cardId) {
  const hand = state.hands[player];
  const index = hand.findIndex((c) => c.id === cardId);
  if (index < 0) return null;
  return hand.splice(index, 1)[0];
}

/** 技能可用的引擎接口（以参数形式传给钩子，避免技能反向依赖 game.js）。 */
const SKILL_API = {
  drawCards,
  setPendingChoice,
  takeFromHand,
  other,
};

/** 选技完成或直接指定技能后，执行 onGameStart 钩子。 */
function runGameStartHooks(state, rng) {
  for (const entry of skillContextOf(state).entries) {
    const hook = entry.skill.hooks.onGameStart;
    // rng 传给钩子：观星要"随机"拿对方 3 张牌，必须可复现
    if (hook) hook(skillContextOf(state), state, entry.player, SKILL_API, rng);
  }
}

/** 选择技能（选技阶段）。picks 按"选择顺序"记录，元素是玩家号。 */
function chooseSkill(state, player, skillId) {
  if (!state.draft) throw new Error('当前不在选技阶段');
  if (state.result.over) throw new Error('对局已结束');
  const order = state.draft.order;
  const pickedCount = state.draft.picks.length;
  const nextPicker = order[pickedCount];
  if (player !== nextPicker) throw new Error(`还没轮到玩家 ${player} 选技能`);
  if (!state.draft.options.includes(skillId)) throw new Error('该技能不在候选里');
  // 已经被选走的技能不能重复选——否则"后手先选"就没有意义了
  if (!state.draft.available.includes(skillId)) throw new Error('该技能已被对方选走');
  if (state.skills[player]) throw new Error('该玩家已经选过技能');

  const next = clone(state);
  next.draft.picks.push(player);
  next.skills[player] = skillId;
  next.draft.available = next.draft.available.filter((id) => id !== skillId);

  if (next.draft.picks.length >= order.length) {
    next.draft = null;
    next.current = next.firstPlayer;
    runGameStartHooks(next, createRng(next.turn * 7919 + 13));
    // 开局钩子可能挂起交互式选牌（观星）：此时把行动权交给需要选牌的人
    if (next.pendingChoice) next.current = next.pendingChoice.player;
  } else {
    next.current = order[next.draft.picks.length];
  }
  return next;
}

/** 当前该由谁做决定（选技 / 选牌），没有则返回 null。 */
function waitingFor(state) {
  if (state.result.over) return null;
  if (state.draft) return state.draft.order[state.draft.picks.length] ?? null;
  if (state.pendingChoice && !state.pendingChoice.ready) return state.pendingChoice.player;
  return null;
}

/** 牌堆抽空后，需要连续过牌几次才结算（双方各两次 = 每人多等一个回合）。 */
const SETTLE_PASSES = 4;

/** 跳过行动或过牌之后的收尾：结算判断 + 换手。 */
function finishTurn(state, actionType) {
  // 结算条件：牌堆已空 且 双方各连续过了两次牌（跳过行动也计入，避免僵局）。
  // 原来是"各过 1 次"，等于无路可走时立刻收场；现在多给一个回合的缓冲，
  // 让双方还有机会靠技能/最后的牌改变结果。
  if (actionType === 'pass' || actionType === 'skip') {
    if (state.consecutivePasses >= SETTLE_PASSES && state.deck.length === 0) {
      settle(state);
      return;
    }
  }
  if (state.turn > state.turnLimit) {
    settle(state, '达到回合上限，按手牌数结算');
    return;
  }
  // 下回合限制只作用于"对方紧接的那一个回合"。
  // 按玩家分槽存储 + ready 标记：
  //   - 刚挂上、还没轮到他的限制（ready=false）留到他的回合才生效；
  //   - 他这个回合结束了，才把已生效的那批清掉。
  // 这样在自己回合内挂给对手的限制不会被自己清掉，也不会覆盖对手已有的限制。
  consumeRestrictions(state, state.current);
  state.current = other(state.current);
  markRestrictionsReady(state, state.current);
}

function settle(state, reason = '牌堆已空，双方连续过牌两轮') {
  const a = state.hands[0].length;
  const b = state.hands[1].length;
  if (a === b) state.result = { over: true, winner: null, reason: `${reason}：手牌相同，平局` };
  else state.result = { over: true, winner: a < b ? 0 : 1, reason: `${reason}：手牌 ${a} : ${b}` };
}

/**
 * 执行一个着法。
 * @returns {GameState} 新状态（永不修改入参）
 */
function applyAction(state, action) {
  if (state.result.over) throw new Error('对局已结束');
  if (!action || !['place', 'pass', 'skill', 'chooseCard', 'confirmChoice'].includes(action.type)) {
    throw new Error('未知着法');
  }

  // 选技阶段与交互式选牌期间，只接受对应的着法
  if (state.draft) throw new Error('当前在选技阶段，请先选择技能');
  if (state.pendingChoice) {
    if (action.type !== 'chooseCard' && action.type !== 'confirmChoice') throw new Error('当前需要先完成选牌');
    return applyChoiceStep(state, action);
  }
  // 校验"该谁走"时以着法自带的 player 为准，而不是 state.current。
  // 原因：AI 搜索会按层交替推演双方，用 toMove 生成着法但不改 state.current——
  // 这是合法的内部用法，不该被当成"抢回合"。传错玩家时仍会被下面的合法性校验拦下。
  if (action.player !== 0 && action.player !== 1) throw new Error(`非法玩家：${action.player}`);

  const next = clone(state);
  next.turn = state.turn + 1;
  const log = { type: action.type, player: action.player, col: action.col ?? null, card: action.card ?? null };
  next.lastAction = log;

  if (action.type === 'pass') return applyPass(next, action, log);

  // 合法性统一用"原状态"校验，避免克隆体带来的差异
  verifyLegal(state, action);

  if (action.type === 'skill') return applySkill(next, state, action, log);

  // ---- 放置卡牌 ----
  const hand = next.hands[action.player];
  const card = hand[action.handIndex];
  verifyHandIds(hand);

  hand.splice(action.handIndex, 1);
  next.consecutivePasses = 0;
  next.history.push([action.player, 'place']);

  const stack = next.bases[action.col];
  if (isBomb(card)) {
    // 炸掉顶端数字；基底（该列最下面那张）本身不可被炸。
    const canDestroy = stack.length > 1;
    const destroyed = canDestroy ? stack.pop() : null;
    next.outOfPlay.push(card);
    if (destroyed) next.outOfPlay.push(destroyed);
    // 放过 E 也算"放过 E/M"——威严的保护条件用 emPlaced 判定，必须两边都记
    next.emPlaced[action.player] += 1;
    log.destroyed = destroyed ? [destroyed] : [];
  } else if (isMagic(card)) {
    next.outOfPlay.push(card);
    next.emPlaced[action.player] += 1;
    // M 产生的就是一条"下回合限制"，与禁锢/荆棘走同一套机制。
    next.restriction = addRestriction(next, 1 - action.player, restrictionFromMagic(action.player, action.col, card));
    log.magic = next.restriction;
  } else {
    // 数字牌落桌同样算"放过牌"——爆弹的被动效果挂在这里
    stack.push(card);
    next.lastDigit[action.player] = { turn: next.turn, cardId: card.id };
  }

  // 技能：牌落桌之后触发（荆棘在这里挂上限制）
  for (const entry of skillContextOf(next).entries) {
    const hook = entry.skill.hooks.onPlaced;
    if (hook) hook(skillContextOf(next), next, action, SKILL_API);
  }

  if (hand.length === 0) {
    next.result = { over: true, winner: action.player, reason: '出完手牌' };
    return next;
  }

  finishTurn(next, 'place');
  return next;
}

function applyPass(next, action, log) {
  next.history.push([action.player, 'pass']);
  next.consecutivePasses += 1;

  // 抽牌方案：默认自己 2 张、对方 1 张；技能可以改写（汇流）。
  const plan = drawPlanFor(next, action.player);
  const selfDraw = plan ? plan.self : 2;
  const opponentDraw = plan ? plan.opponent : 1;
  const needed = selfDraw + opponentDraw;
  if (next.deck.length >= (plan ? 1 : 3)) {
    log.drawn = {
      [action.player]: drawCards(next, action.player, selfDraw),
      [other(action.player)]: drawCards(next, other(action.player), opponentDraw),
    };
    if (next.deck.length < needed) log.drawnShort = true;
  } else {
    log.drawn = null;
  }

  // 技能：过牌抽完之后（汇流在这里挂起"交一张给对手"）
  for (const entry of skillContextOf(next).entries) {
    if (entry.player !== action.player) continue;
    const hook = entry.skill.hooks.afterPassDraw;
    if (hook) hook(skillContextOf(next), next, action.player, SKILL_API, plan);
  }
  if (next.pendingChoice) {
    log.turnPending = true;
    return next;
  }

  finishTurn(next, 'pass');
  return next;
}

function applySkill(next, prev, action, log) {
  const skill = getSkill(action.skill);
  if (!skill) throw new Error(`未知技能：${action.skill}`);
  if (next.skills[action.player] !== action.skill) throw new Error('你没有这个技能');
  const used = next.usesById[action.skill] ?? 0;
  if (skill.type !== 'active' || used >= skill.maxUses) throw new Error(`技能 ${action.skill} 已用完`);

  // 需要指定手牌的技能（甩手）：先把那张牌从手牌里取出来交给钩子
  let carried = null;
  if (action.handIndex !== undefined && action.handIndex !== null) {
    carried = takeFromHand(next, action.player, action.card?.id);
    if (!carried) throw new Error('指定的手牌不存在');
    action = { ...action, card: carried };
  }

  const handled = skill.hooks.applyAction?.(skillContextOf(next), next, action, log, SKILL_API);
  if (handled === false) throw new Error(`技能 ${action.skill} 执行失败`);

  next.usesById[action.skill] = used + 1;
  next.skillUses[action.player] = (next.skillUses[action.player] ?? 0) + 1;
  next.history.push([action.player, 'skill']);

  // 手牌清空即胜——不管牌是怎么离开手的。
  // 甩手把最后一张手牌丢进已出局区时，效果与"出完手牌"完全一致：
  // 立刻结束对局、弃牌者获胜（否则会出现手牌为 0 却不结束的死局）。
  if (next.hands[action.player].length === 0) {
    next.result = { over: true, winner: action.player, reason: '出完手牌' };
    return next;
  }

  // 不占用行动的技能（消却）：回合数回退，保持"还是这个回合"
  if (log.turnEnds === false) {
    next.turn = prev.turn;
    return next;
  }
  if (next.pendingChoice) return next;
  finishTurn(next, action.skill === 'shuimian' ? 'skip' : 'place');
  return next;
}

/**
 * 交互式选牌的一步。
 * - chooseCard：记录一张；若已经选够 count 张，就地生效。
 * - confirmChoice：把已选的若干张一次性生效（用于"一次选 3 张"的技能）。
 */
function applyChoiceStep(state, action) {
  const choice = state.pendingChoice;
  if (!choice) throw new Error('当前没有待完成的选牌');
  if (action.player !== choice.player) throw new Error(`该由玩家 ${choice.player} 选牌`);

  const hand = state.hands[choice.player] ?? [];
  const picked = [...(choice.picked ?? [])];

  if (action.type === 'chooseCard') {
    if (!hand.some((c) => c.id === action.cardId)) throw new Error('所选牌不在手牌里');
    // candidateIds 把候选限定成一部分时（汇流：只能交刚抽到的牌），这里必须同样校验
    if (choice.candidateIds && !choice.candidateIds.includes(action.cardId)) {
      throw new Error('这张牌不在本次可选范围里');
    }
    if (picked.includes(action.cardId)) throw new Error('这张牌已经选过了');
    picked.push(action.cardId);
  } else {
    if (picked.length === 0) throw new Error('还没有选任何牌');
  }

  const need = choice.count ?? 1;
  const shouldApply = action.type === 'confirmChoice' || picked.length >= need;

  const next = clone(state);
  next.turn = state.turn + 1;

  if (!shouldApply) {
    // 还没选够：只更新进度，回合不结束
    next.pendingChoice = { ...choice, picked };
    next.turn = state.turn;
    next.lastAction = { type: 'chooseCard', player: choice.player, card: action.card ?? null };
    return next;
  }

  if (picked.length !== need) throw new Error(`需要选 ${need} 张，实际选了 ${picked.length} 张`);

  const skill = getSkill(next.skills[choice.player]);
  const request = { ...choice, cardIds: picked, picked, ready: true };
  const handled = skill?.hooks.applyChoice?.(skillContextOf(next), next, request, SKILL_API);
  if (handled === false) throw new Error('选牌结果无法应用');

  next.pendingChoice = null;
  next.lastAction = { type: 'chooseCard', player: choice.player, card: action.card ?? null };

  // 开局阶段的选牌（观星在游戏开始时触发）**不是一个回合**：
  // 它必须原样交还给先手，既不能吃掉先手的第一手，也不能推进 turn
  // ——否则禁列判定（要求 turn === 1）会失效。
  if (choice.phase === 'opening') {
    next.turn = state.turn;
    next.current = state.firstPlayer;
    return next;
  }

  // 回合内的选牌（汇流交牌）属于发动者那一回合的一部分：先回到发动者，再正常结束回合换手。
  next.current = choice.player;
  finishTurn(next, 'place');
  return next;
}

/** 校验着法是否在当前合法着法集合里（用原状态校验）。 */
function verifyLegal(state, action) {
  const legal = playerActions(state, action.player);
  const found = legal.some((a) => {
    if (a.type !== action.type) return false;
    if (action.type === 'place') return a.col === action.col && a.handIndex === action.handIndex;
    if (action.type === 'skill') {
      if (a.skill !== action.skill) return false;
      if (a.col !== action.col) return false;
      if (a.handIndex !== undefined) return a.handIndex === action.handIndex;
      return true;
    }
    if (action.type === 'chooseCard') return a.cardId === action.cardId;
    if (action.type === 'confirmChoice') return true;
    return true;
  });
  if (!found) throw new Error('非法着法');
}

function verifyHandIds(hand) {
  const ids = new Set();
  for (const card of hand) {
    if (ids.has(card.id)) throw new Error(`手牌出现重复 id：${card.id}`);
    ids.add(card.id);
  }
}

/** 对局是否结束。 */
const isOver = (state) => state.result.over;

/** 从某玩家视角的胜负（1 胜 / 0 平 / -1 负；未结束返回 null）。 */
function outcomeFor(state, player) {
  if (!state.result.over) return null;
  if (state.result.winner === null) return 0;
  return state.result.winner === player ? 1 : -1;
}

/**
 * 牌数守恒校验：牌堆 + 基底 + 双方手牌 + 已出局 = 37。
 *
 * 「创生」会凭空造牌，所以 expected 会把造出来的张数一起算上：
 * 这样"牌数守恒"这条不变量依然成立，同时又能抓出真正丢牌/多牌的 bug。
 */
function cardCounts(state) {
  const inPlay = state.bases.reduce((sum, stack) => sum + stack.length, 0);
  const hands = state.hands[0].length + state.hands[1].length;
  const created = state.createdCards?.length ?? 0;
  const total = state.deck.length + inPlay + hands + state.outOfPlay.length;
  return {
    deck: state.deck.length,
    board: inPlay,
    hands,
    outOfPlay: state.outOfPlay.length,
    created,
    total,
    expected: DECK_SIZE + created,
  };
}

/** 取"当前行动方身上生效的下回合限制"（第一条；供只关心单条限制的调用方）。 */
function activeRestriction(state) {
  return firstRestriction(state, state.current) ?? null;
}

/** 取"某个玩家身上生效的全部下回合限制"（可能有 0 条、1 条或多条）。 */
function activeRestrictions(state, player = state.current) {
  return restrictionsFor(state, player);
}

/** 把状态整理成一行摘要，便于 CLI 与日志。 */
function summarize(state) {
  const label = (c) => {
    if (isDigit(c)) {
      if (c.color === 'purple') return '紫0';
      if (c.color === 'black') return '黑5';
      return String(c.rank);
    }
    return `${c.color === 'dark' ? '深' : '浅'}${isBomb(c) ? 'E' : 'M'}`;
  };
  const board = state.bases.map((stack) => stack.map(label).join('>'));
  const restriction = activeRestriction(state);
  const restrictionLabel = restriction ? ` ${restriction.label ?? restriction.kind}限制` : '';
  const skills = state.skills?.some(Boolean) ? ` 技能[${state.skills.map((id) => (id ? getSkill(id)?.name ?? id : '—')).join('/')}]` : '';
  return `T${state.turn} 玩家${state.current + 1} 列[${board.join(' | ')}] 手牌 ${state.hands[0].length}:${state.hands[1].length} 堆 ${state.deck.length}${hasPurpleLock(state) ? ' 紫0限锁' : ''}${restrictionLabel}${skills}`;
}

// ─── src/ai/heuristics.js ────────────────────────────────────────
/**
 * 局面评估启发式。
 *
 * AI 的每一档难度都共用这里的评估函数，区别只在于"看得多远"：
 *   简单 = 只收集合法着法后随机选
 *   普通 = 评估当前选择 + 一步对手最佳回应
 *   困难 = 在采样出的对手手牌上做定深搜索
 * 因此想调 AI 强度，改这里的权重即可影响全部难度。
 */




/** 权重集中在这里，方便用模拟器调参。 */
const WEIGHTS = Object.freeze({
  handDiff: 10,
  mobility: 2.0, // 牌桌可接数字的种类数
  playable: 2.6, // 手牌里现在就能打出去的张数
  control: 1.6,
  tempo: 2.5,
  endgame: 6,
  pressure: 24,
  bombBase: 6,
  bombPerRank: 1.5,
  bombOnFive: 3, // 黑 5 免疫炸弹，炸它没意义（引擎本来也不给这个着法）
  bombOnBase: -4,
  magicBase: 2.5,
  magicPerOption: 0.7,
  digitBase: 1,
  digitExactHalf: 0.6,
  digitOnFive: 2.5,
  digitToZero: 2,
  purple: 12,
  purpleLocked: 4,
  revealBase: 5,
  blackFiveSafe: 0.8, // 黑 5 免疫炸弹 + 只接 0，是很安全的窄口顶牌
});

/** 形成"控制"的顶端牌：对手可接的数字越少越强。 */
function controlValue(card) {
  if (!card || !isDigit(card)) return 0;
  if (isPurpleZero(card)) return 12;
  if (isBlackFive(card)) return 5;
  const options = allowedRanksOn(card).length;
  return options === 1 ? 6 : 1.5;
}

/** 牌桌上可接数字的总种类数（列越"宽"越自由）。 */
function columnMobility(state) {
  let total = 0;
  for (let col = 0; col < state.bases.length; col++) {
    const top = topOf(state, col);
    if (top) total += allowedRanksOn(top).length;
  }
  return total;
}

/** 玩家 p 手牌里"现在就能打出去"的张数（真实的行动自由）。 */
function playableCount(state, p) {
  if (!state.hands[p]) return 0;
  let count = 0;
  for (const card of state.hands[p]) {
    for (let col = 0; col < state.bases.length; col++) {
      if (canPlaceAt(state, p, col, card).ok) {
        count += 1;
        break;
      }
    }
  }
  return count;
}

/** 综合行动自由：牌桌宽度 + 自己能出的牌数。 */
function mobility(state, p) {
  return columnMobility(state) + playableCount(state, p);
}

/**
 * 从 p 视角评估局面（正数对 p 有利）。不含终局判断。
 * @param {object} state
 * @param {number} p
 * @param {object} [w] 权重覆盖，便于模拟器调参
 */
function evaluate(state, p, w = WEIGHTS) {
  const opp = other(p);
  let score = 0;

  // 1) 手牌差：自己手牌越少越好。
  score += w.handDiff * (state.hands[opp].length - state.hands[p].length);

  // 2) 行动自由：牌桌可接的数字种类（对双方等价，作为整体宽度）+ 自己现在就能出的牌数。
  score += w.mobility * (columnMobility(state) - 4);
  score += w.playable * (playableCount(state, p) - playableCount(state, opp));

  // 3) 顶端控制：让对手可选数字变少的顶端更强。
  for (let col = 0; col < state.bases.length; col++) {
    const top = topOf(state, col);
    if (top) score += w.control * controlValue(top);
  }

  // 4) 节奏：谁在推进局面，谁就掌握主动。
  const recent = state.history.slice(-6);
  if (recent.length > 0) {
    const mine = recent.filter((e) => e[0] === p && e[1] === 'place').length;
    const theirs = recent.filter((e) => e[0] === opp && e[1] === 'place').length;
    score += WEIGHTS.tempo * (mine - theirs);
  }

  // 5) 终局阶段：牌堆见底时，手牌数直接决定胜负。
  if (state.deck.length === 0) {
    score += WEIGHTS.endgame * (state.hands[opp].length - state.hands[p].length);
  }

  // 6) 临门一脚：对手快要出完时，必须优先压制。
  if (state.hands[opp].length <= 2) score -= WEIGHTS.pressure * (3 - state.hands[opp].length);
  if (state.hands[p].length <= 2) score += WEIGHTS.pressure * (3 - state.hands[p].length);

  return score;
}

/**
 * 技能着法的价值评估。
 * 这里只做"粗评"，作用是让排序不至于把技能排到过牌之后；
 * 真正的取舍由搜索在后续层里体现。
 */
function skillScore(state, action, p) {
  const opp = other(p);
  // 限制是"每人一槽、可叠加"的：沉默（禁 E/M）和荆棘（禁压某张牌）可以和别的限制共存，
  // 但"把牌锁到某一列"这一类是互斥的——禁锢 / 爆弹 / 深 M 都写 allowedColumns，
  // 再补一条只会把前一条顶掉，纯亏一次技能次数。所以只对这一类做抑制。
  const COLUMN_LOCKS = ['magic-dark', 'magic-light', 'baodan-lock', 'skill-jinggu'];
  const oppRestrictions = restrictionsFor(state, opp);
  const hasColumnLock = oppRestrictions.some((r) => COLUMN_LOCKS.includes(r.kind));
  if (hasColumnLock && action.skill === 'jinggu') return -50;

  // 沉默现在同时禁 E/M 和主动技能：两者都打不到才不值得用
  if (action.skill === 'chenmo') {
    const hasEM = state.hands[opp].some((c) => c.kind !== 'number');
    // 对手还有没用完的主动技吗（沉默也会把它一起封掉）
    const oppHasActive = skillContextOf(state).entries.some((e) => {
      if (e.player !== opp) return false;
      if (e.skill.type !== 'active') return false;
      return (state.usesById[e.skill.id] ?? 0) < e.skill.maxUses;
    });
    if (!hasEM && !oppHasActive) return -20;
  }

  switch (action.skill) {
    case 'xiaoque': {
      // 移除顶端：如果移除后对手的行动自由明显变小，就更值得
      const before = mobility(state, opp);
      const top = topOf(state, action.col);
      const freed = top ? allowedRanksOn(top).length : 0;
      return 3 + freed * 1.2 + (before > 0 ? 0.5 : 0);
    }
    case 'jinggu':
      // 与深 M 完全同一个效果，因此共用同一个"封锁着法数"算法与同一套权重
      return 5.5 + lockedOutCount(state, opp, action.col) * WEIGHTS.magicPerOption;
    case 'shuimian': {
      // 跳过对手一次行动 ≈ 白赚一个回合；牌堆空时几乎没有意义
      if (state.deck.length === 0) return 0.5;
      const oppE = state.hands[opp].filter((c) => c.kind !== 'number').length;
      return 5 + oppE * 0.5;
    }
    case 'shuaishou': {
      // 丢一张手牌：手牌越多越值（更快出完）。
      // 手里只剩最后一张时这一手直接获胜，必须给一个压倒性的分数。
      if (state.hands[p].length <= 1) return 60;
      return 2 + Math.min(3, state.hands[p].length * 0.4);
    }
    case 'kanpo':
      // 不占行动，纯信息收益：排在"随便出牌"之后，但明显优于过牌。
      return 4;
    case 'chenmo': {
      // 沉默：封掉对手下回合的 E/M。对手手里的 E/M 越多越值；
      // 对手手牌越少、"少一张牌可出"的伤害越大。
      const oppEM = state.hands[opp].filter((c) => c.kind !== 'number').length;
      const pressure = state.hands[opp].length <= 3 ? 1.5 : 0;
      return 4.5 + oppEM * 1.5 + pressure;
    }
    case 'chuangsheng': {
      // 创生：塞给对方一张牌。与汇流共用同一套判断——
      // 数这张牌在对方手里有几个落点，落点越少越卡手（0 落点 = 完全打不出去）。
      const rank = action.rank ?? 0;
      const spots = countLandingSpots(state, rank);
      const dead = Math.max(0, 3 - spots); // 0 个落点 = 3 分，3 个及以上 = 0 分
      const pressure = Math.max(0, 3 - state.hands[opp].length) * 1.0;
      return 2.5 + dead * 1.5 + pressure;
    }
    default:
      return 1.5;
  }
}

/**
 * "把对手锁到 col 这一列（且只能出数字牌）"能封掉对手多少个着法。
 *
 * 深 M 与禁锢在引擎里是同一个效果（列限制 + digitsOnly），所以**必须共用这一份算法**，
 * 否则同一个效果会因为两条不同的评分公式而选出不同的列。
 * @returns {number} 被封锁的着法数
 */
function lockedOutCount(state, player, col) {
  const options = playerActions(state, player).filter((a) => a.type === 'place');
  return options.filter((a) => a.col !== col || a.card.kind !== 'number').length;
}

/** 评估"某张牌放到某列"这一手本身的价值（从 p 视角）。 */
function scoreMove(state, action, p) {
  const opp = other(p);
  let score = 0;

  if (action.type === 'pass') {
    // 过牌：手牌变多，但换来对手也拿 1 张；牌堆空时可用来拖到结算。
    if (state.deck.length === 0) {
      const passScore = WEIGHTS.handDiff * 0.4;
      return -2 + passScore;
    }
    return -6;
  }

  // 技能与选牌着法没有"牌 + 列"结构，单独给分（避免下面按牌类型判断时崩掉）
  if (action.type === 'skill') {
    return skillScore(state, action, p);
  }
  if (action.type === 'chooseCard') {
    // 选牌本身不是收益，给一个很小的正值以便它不会被当成"过牌"那样被压掉
    return 0.5;
  }
  if (action.type === 'confirmChoice') return 0.4;

  const card = action.card;
  const stack = state.bases[action.col];
  const top = topOf(state, action.col);

  if (isBomb(card)) {
    const rank = top?.rank ?? 0;
    score += WEIGHTS.bombBase + rank * WEIGHTS.bombPerRank;
    if (top && isBlackFive(top)) score -= WEIGHTS.bombOnFive;
    if (stack.length === 2) score += WEIGHTS.bombOnBase; // 炸掉后基底直接暴露
  } else if (isMagic(card)) {
    // 深 M：锁一列；浅 M：封一列。两者都用"被封掉的着法数"衡量，只是作用范围不同
    const options = legalActions(state, opp).filter((a) => a.type === 'place');
    const blocked = isDark(card)
      ? lockedOutCount(state, opp, action.col)
      : options.filter((a) => a.col === action.col).length;
    score += WEIGHTS.magicBase + blocked * WEIGHTS.magicPerOption;
  } else {
    score += WEIGHTS.digitBase;
    if (top) {
      // 放 5 或 0 能制造"只有一种接法"的窄口。
      if (card.rank === 5) score += WEIGHTS.digitOnFive;
      if (card.rank === 0) score += WEIGHTS.digitToZero;
      const options = allowedRanksOn(card);
      if (options.length === 1) score += WEIGHTS.digitExactHalf;
      if (card.rank === top.rank + 1) score += 0.5; // 略微偏好更自然的连牌
    }
    if (isPurpleZero(card)) score += WEIGHTS.purple;
    if (isBlackFive(card)) score += WEIGHTS.blackFiveSafe;
    // 把基底盖住（列高 1 -> 2）能防止对手直接炸基底。
    if (stack.length === 1) score += WEIGHTS.revealBase * 0.2;
  }

  // 全局紫 0 限锁下，出数字牌是唯一选择，额外加分以体现"能出就出"。
  if (hasPurpleLock(state) && isDigit(card)) score += WEIGHTS.purpleLocked;
  return score;
}

/**
 * 搜索专用的"技能探索加成"。
 *
 * 搜索按 beamWidth 只保留前 N 个着法，技能着法的静态分普遍低于出牌，
 * 结果就是"技能根本没进搜索树"，AI 永远不会考虑它。
 * 这里只在排序时人为抬高技能着法，让它们至少被评估过——
 * **最终打分不加这个加成**，所以不会因此高估技能。
 */
const SKILL_SEARCH_BIAS = 12;

/** 立刻能赢的着法检查（出完手牌 / 把最后一张手牌弃掉）。 */
function immediateWin(state, action, p) {
  if (state.hands[p].length !== 1) return false;
  if (action.type === 'place') return true;
  // 甩手丢掉最后一张手牌，引擎里同样判"出完手牌"获胜
  return action.type === 'skill' && action.skill === 'shuaishou';
}

/** 给着法排序，供搜索剪枝使用。 */
function orderActions(state, actions, p) {
  return actions
    .map((action) => ({
      action,
      score: (immediateWin(state, action, p) ? 1e6 : 0)
        + scoreMove(state, action, p)
        + (action.type === 'skill' ? SKILL_SEARCH_BIAS : 0),
    }))
    .sort((a, b) => b.score - a.score)
    .map((entry) => entry.action);
}

/** 若局面已结束，返回从 p 视角的终局分值。 */
function terminalScore(state, p) {
  const outcome = outcomeFor(state, p);
  if (outcome === null) return null;
  if (outcome > 0) return 1e9 + state.hands[other(p)].length * 100;
  if (outcome < 0) return -(1e9 + state.hands[p].length * 100);
  return 0;
}

/**
 * 定深搜索（negamax + alpha-beta），支持"信息不完全"下的确定性采样。
 *
 * 真实对局里 AI 看不到对手手牌，所以搜索前先把对手手牌按剩余未知牌采样一次
 * （determinization），在这套假定完整信息上搜索。多次采样取平均即为困难档。
 *
 * 视角约定（重要）：search() 返回的是「当前该走的一方」的分数，标准 negamax。
 * 父节点取负号后即为自己的分数。这样在任意深度的静态评估都不会出现视角错位。
 */


/**
 * @typedef {object} SearchConfig
 * @property {number} depth      搜索深度（层数 = 双方各走一步算 2 层）
 * @property {number} beamWidth  每层最多展开的着法数
 * @property {number} maxNodes   节点预算上限（防止长考）
 */

/** @type {SearchConfig} */
const DEFAULT_SEARCH = Object.freeze({ depth: 4, beamWidth: 12, maxNodes: 2500 });

/**
 * @param {object} state
 * @param {number} toMove    当前该谁走（也是返回值视角）
 * @param {number} depth
 * @param {number} alpha
 * @param {number} beta
 * @param {SearchConfig} config
 * @param {{nodes: number}} counter
 */
function search(state, toMove, depth, alpha, beta, config, counter) {
  // 终局：从"该走的一方"视角看，若对局已结束，直接给结果分。
  const terminal = terminalScore(state, toMove);
  if (terminal !== null) return terminal;
  // 交互式选牌节点（观星/汇流的中间态）：不继续展开，直接静态评估。
  // 这类节点的行动方可能不是 toMove，展开会破坏"按层交替"的假设。
  if (state.pendingChoice || state.draft) return evaluate(state, toMove);
  if (depth <= 0 || counter.nodes >= config.maxNodes || state.turn > state.turnLimit) {
    return evaluate(state, toMove);
  }
  counter.nodes += 1;

  // 用 playerActions：它包含主动技与技能带来的各类着法
  const actions = orderActions(state, playerActions(state, toMove), toMove).slice(0, config.beamWidth);
  if (actions.length === 0) return evaluate(state, toMove);

  let best = -Infinity;
  for (const action of actions) {
    const next = applyAction(state, action);
    const value = -search(next, 1 - toMove, depth - 1, -beta, -alpha, config, counter);
    if (value > best) best = value;
    if (best > alpha) alpha = best;
    if (alpha >= beta) break;
  }
  return best;
}

/**
 * 在一个（采样后的）完整信息局面上挑最佳着法。
 * @returns {{action: object, score: number, nodes: number}} score 从 player 视角
 */
function bestMoveInWorld(state, player, config = DEFAULT_SEARCH) {
  // 处于选牌中间态时不做搜索：交给专门的选牌策略
  if (state.pendingChoice || state.draft) {
    const actions = playerActions(state, player);
    return { action: actions[0] ?? null, score: evaluate(state, player), nodes: 0 };
  }
  const actions = orderActions(state, playerActions(state, player), player);
  const counter = { nodes: 0 };
  let best = actions[0];
  let bestScore = -Infinity;

  for (const action of actions) {
    const next = applyAction(state, action);
    // 走完这一手后轮到对手，对手视角的分数取负即为自己的分数。
    const opponentView = search(next, 1 - player, Math.max(0, config.depth - 1), -Infinity, Infinity, config, counter);
    const score = -opponentView;
    if (score > bestScore) {
      bestScore = score;
      best = action;
    }
  }
  return { action: best, score: bestScore, nodes: counter.nodes };
}

/**
 * AI 难度档位。
 *
 * 三档共用同一套引擎与启发式，差别只在"算得多深"：
 *   easy   随机出牌（会犯明显错误，适合先熟悉规则）
 *   normal 在真实局面上搜索 2 层（能算出对手的最佳回应）
 *   hard   在真实局面上搜索 3 层（能看到"我出 → 对手回敬 → 我再回敬"）
 *
 * 实测（tools/ai-lab3.mjs，每对 60 局、交替先后手）：
 *   d2 对随机 65% ｜ d3 对随机 73% ｜ d4 对随机 77%
 *   d3 对 d2 63.3% ｜ d4 对 d2 63.3%（d3 → d4 收益已趋平）
 * 因此 hard 取 d3：强度提升明显，单步耗时仍在 ~40ms 量级。
 *
 * 为什么困难档不"猜对手手牌"：tools/ai-lab.mjs 实测表明，把对手手牌换成
 * 未知牌池里的牌（哪怕只换一部分）会让胜率从 ~60% 掉到 ~38%——
 * 这个游戏对"某张关键牌是否在对手手里"极其敏感，错误的建模比不建模更糟。
 * 所以三档都只用公开信息 + 真实手牌，强度靠搜索深度拉开。
 *
 * 想加新档位用 createProfile，不必修改本文件的现役配置。
 */








/** 简单档：完全随机，只在小概率下主动过牌。 */
function randomPick(state, player, rng) {
  const actions = playerActions(state, player);
  const placements = actions.filter((a) => a.type === 'place' || a.type === 'skill');
  if (placements.length === 0) return actions.find((a) => a.type === 'pass') ?? actions[0];
  if (rng.next() < 0.05) return actions.find((a) => a.type === 'pass') ?? placements[0];
  return placements[rng.int(placements.length)];
}

/** 普通/困难档：在真实局面上做定深搜索。 */
function treePick(state, player, rng, config) {
  const { action } = bestMoveInWorld(state, player, {
    depth: config.depth,
    beamWidth: config.beamWidth,
    maxNodes: config.maxNodes,
  });
  if (action) return action;
  return orderActions(state, playerActions(state, player), player)[0];
}

/**
 * 只在"有牌可放却想空过"时兜底：避免 AI 用无意义的过牌拖时间。
 * 牌堆已空时过牌是合法的拖时间手段（能逼出比手牌的结算），保留不干预。
 * 技能可以对过牌做出修正（例如汇流），这时候也不干预——否则会把技能收益丢掉。
 */
function guardWastefulPass(state, player, action) {
  if (!action || action.type !== 'pass') return action;
  if (state.deck.length === 0) return action;
  const modifier = passModifierFor(state, player);
  if (modifier) return action;
  const placements = playerActions(state, player).filter((a) => a.type === 'place');
  if (placements.length === 0) return action;
  return orderActions(state, placements, player)[0];
}

/**
 * 主动技的使用判断。
 * 目前用保守策略：只有当"这一手不是唯一出路"时才会考虑技能，
 * 避免简单/普通档因为用技能而放弃必要的出牌。
 */
function shouldUseSkill(state, player, action) {
  if (!action || action.type !== 'skill') return true;
  const placements = playerActions(state, player).filter((a) => a.type === 'place');
  // 手牌马上出完时优先出牌（能直接赢）
  if (state.hands[player].length === 1 && placements.length > 0) return false;
  // 看破不占行动，而且看得越早越有用（能提前规划），所以有就先用
  if (action.skill === 'kanpo') return true;
  return true;
}

/** 该玩家的过牌是否被技能改写（汇流）。改写过就不要用"出牌"去替换过牌。 */
function passModifierFor(state, player) {
  for (const entry of skillContextOf(state).entries) {
    if (entry.player !== player) continue;
    const hook = entry.skill.hooks.drawOnPass;
    if (hook && hook(skillContextOf(state), state, player)) return true;
  }
  return false;
}

/**
 * 技能强度表：用配对 A/B 实测得到的净胜率（技能对白板），单位是百分点。
 *
 * 来源：`技能强度报告-重测.md`（12 技能各 500 局，配对标准误 ±2.2pp，
 * 12 个里 10 个统计显著、8 个过 Bonferroni）。这张表只影响**选技优先级**，
 * 不参与对局内的着法评估。
 *
 * 关于「沉默」：它是**对技能持有者的特攻**（禁对方 E/M + 禁对方主动技），
 * 而本表用的是"技能对白板"口径（对手不带任何技能）——那个口径里沉默没有打击目标，
 * 测出来只会是 ≈0，没有意义。所以沉默的分数按"它克制的技能越多越值"给一个固定值，
 * 不参与重测。
 */
const SKILL_STRENGTH = Object.freeze({
  jingji: 25, // 荆棘  +25.3
  guanxing: 19, // 观星  +19.1（重测：3 张改 2 张后从 +23.5 小幅回落）
  huiliu: 17, // 汇流  +17.4（重测：改成"只能交刚抽到的 3 张里那张"后，从 +32.1 大幅回落）
  chuangsheng: 16, // 创生  +16.4
  shuaishou: 13, // 甩手  +13.2
  weiyan: 8, // 威严   +8.4
  xiaoque: 8, // 消却   +7.9
  shuimian: 8, // 睡眠   +7.8
  jinggu: 6, // 禁锢   +5.8（重测：与深 M 统一选列算法后基本不变）
  // 沉默：特攻型（禁对方 E/M + 禁对方主动技），"对白板"口径测不出它的价值，
  // 这里给一个固定估值，不参与重测。
  chenmo: 5,
  baodan: 5, // 爆弹   +4.6（重测：取消全部豁免后略升，但仍不显著）
  kanpo: -1, // 看破   −1.1（不显著，对 AI 无价值）
});

/** 取技能强度分（未知技能给一个保守的中间值）。 */
function skillStrength(id) {
  return SKILL_STRENGTH[id] ?? 6;
}

/**
 * AI 在选技阶段挑一个候选。
 *
 * 策略：按实测强度做 softmax。强度高的技能大概率被选走，
 * 但保留噪声——`sharpness` 越小越随机（简单档容易被"看着还行"的技能骗走），
 * 越大越接近"永远选最强"（困难档）。
 *
 * @param {object} state
 * @param {object} [rng] 随机源；不传就退化成"直接选最强"（测试与固定阵容用）
 * @param {number} [sharpness] 选择锐度：0 = 均匀随机，6 ≈ 95% 选到最强
 */
function aiPickDraftSkill(state, rng = null, sharpness = 6) {
  const pool = state.draft?.available?.length ? state.draft.available : (state.draft?.options ?? []);
  if (pool.length === 0) return null;
  if (!rng || sharpness <= 0) {
    // 无随机源：确定性挑最强（并列时保持候选原顺序，保证可复现）
    return pool.reduce((best, id) => (skillStrength(id) > skillStrength(best) ? id : best), pool[0]);
  }
  const weights = pool.map((id) => Math.exp((skillStrength(id) * sharpness) / 10));
  const total = weights.reduce((a, b) => a + b, 0);
  let roll = rng.next() * total;
  for (let i = 0; i < pool.length; i++) {
    roll -= weights[i];
    if (roll <= 0) return pool[i];
  }
  return pool[pool.length - 1];
}

/**
 * AI 的选牌策略（观星交牌 / 汇流交牌 / 创生选数字）。
 *
 * 三种场景现在都是"从自己手里挑一张给对方"，方向完全一致：
 * 交给对手**对他最没用（最卡手）**的牌 —— 统一走 pickWorstCardForOpponent：
 *   1. 当前场上放不出去的普通数字牌（落点 0）
 *   2. 紫 0 限锁下 E/M 也打不出去，这时优先给 E/M
 *   3. 否则按当前落点数从少到多给
 *
 * 曾经的 bug：实现与注释相反，E/M 权重最低被最先送出去，等于帮对手加最强牌
 * （实测汇流净效果为负，与这个 bug 吻合）。
 *
 * 注意观星在平衡性改动后不再"放回抽牌堆"，所以这里已经没有 returnToDeck 分支；
 * 万一以后有技能再引入该 kind，会走到末尾的兜底（按"留最有用的"排序）。
 */
function aiPickChoiceCard(state, choice) {
  const hand = state.hands[choice.player] ?? [];
  const picked = new Set(choice.picked ?? []);
  const candidates = hand.filter((c) => !picked.has(c.id));
  if (candidates.length === 0) return null;

  if (choice.kind === 'giveToOpponent') {
    return pickWorstCardForOpponent(state, candidates);
  }

  // 兜底：放回牌堆类 — 留下最有用的（E/M > 紫 0 > 黑 5 > 当前接得上的数字）
  const keepValue = (card) => {
    if (card.kind !== 'number') return 100;
    if (card.color === 'purple') return 90;
    if (card.color === 'black') return 80;
    return countLandingSpots(state, card.rank) * 10 + card.rank;
  };
  const sorted = [...candidates].sort((a, b) => keepValue(a) - keepValue(b));
  return sorted[0];
}

/** @typedef {{id:string, label:string, description:string, decide:Function, chooseForbiddenColumn:Function}} AiProfile */

/**
 * @param {object} options
 * @param {string} options.id
 * @param {string} options.label
 * @param {string} [options.description]
 * @param {(state:object, player:number, rng:object, config:any) => object} options.pick
 * @param {any} [options.config]
 * @param {(state:object, rng:object) => number} [options.ban]
 * @returns {AiProfile}
 */
function createProfile({ id, label, description = '', pick, config = {}, ban }) {
  /**
   * 处理"非正常回合"的决策：选技与选牌。
   * 选技用 config.skillSharpness 控制"多认真挑最强技能"：
   * 简单档小（容易被弱技能骗走），困难档大（基本都拿最强）。

  function handleSpecial(state, player, rng) {
    if (state.draft) {
      if (waitingFor(state) !== player) return null;
      // 选技阶段返回技能 id（调用方交给 chooseSkill）
      const sharpness = config.skillSharpness ?? 6;
      return { kind: 'skill', skillId: aiPickDraftSkill(state, rng, sharpness) };
    }
    if (state.pendingChoice && state.pendingChoice.player === player) {
      const card = aiPickChoiceCard(state, state.pendingChoice);
      if (!card) return null;
      const action = playerActions(state, player).find((a) => a.type === 'chooseCard' && a.cardId === card.id);
      return action ? { kind: 'action', action } : null;
    }
    return null;
  }

  return {
    id,
    label,
    description,
    config,
    decide(state, player, rng = createRng(1)) {
      const special = handleSpecial(state, player, rng);
      if (special) return special.kind === 'skill' ? special.skillId : special.action;

      const action = pick(state, player, rng, config);
      if (!shouldUseSkill(state, player, action)) {
        const placements = playerActions(state, player).filter((a) => a.type === 'place');
        return orderActions(state, placements, player)[0] ?? action;
      }
      return guardWastefulPass(state, player, action);
    },
    chooseForbiddenColumn(state, rng = createRng(1)) {
      if (ban) return ban(state, rng);
      return suggestForbiddenColumn(state);
    },
  };

/** 对手对某一手的"最强回应"。 */
function opponentBestReply(state, player) {
  const next = { ...state, current: other(player) };
  const reply = orderActions(next, legalActions(next, other(player)), other(player))[0] ?? null;
  return reply;
}

/** 用搜索给全部合法着法打分（简化假设：对手手牌用真实信息替代）。 */
function rankMoves(state, player, searchConfig = DEFAULT_SEARCH) {
  const ranked = [];
  for (const action of orderActions(state, legalActions(state, player), player)) {
    const next = applyAction(state, action);
    const { score } = bestMoveInWorld({ ...next, current: other(player) }, player, searchConfig);
    ranked.push({ action, score, reply: opponentBestReply(next, other(player)) });
  }
  ranked.sort((a, b) => b.score - a.score);
  return ranked;
}

/** 一句话解释这一手为什么值得下。 */
function explainAction(state, action, player) {
  if (!action || action.type === 'pass') {
    if (state.deck.length === 0) return '牌堆已空：过牌不抽牌，直接换手，可以用来逼对手也过牌从而进入结算。';
    const legal = legalActions(state, player).filter((a) => a.type === 'place');
    if (legal.length === 0) return '没有任何合法放置，只能过牌（自己抽 2 张、对手抽 1 张）。';
    return '主动过牌会让自己多 2 张牌、对手多 1 张，通常只有在牌堆见底、想拖到结算时才划算。';
  }

  const card = action.card;
  const top = topOf(state, action.col);
  const reasons = [];
  const colName = `第 ${action.col + 1} 列`;

  if (isBomb(card)) {
    reasons.push(`深/浅 E 直接炸掉${colName}顶端的 ${top?.rank}${top && isBlackFive(top) ? '（黑 5 免疫，不可）' : ''}`);
    if (state.bases[action.col].length === 2) reasons.push('但该列只剩基底，炸完会直接暴露基底');
  } else if (isMagic(card)) {
    reasons.push(
      isDark(card)
        ? `深 M 会逼对手下回合只能在${colName}出数字牌`
        : `浅 M 会封掉${colName}，对手下回合只能去别的列出数字牌`,
    );
  } else {
    if (isPurpleZero(card)) reasons.push('紫 0 能触发全场限锁：双方下回合都只能出数字牌，压制力最强');
    else if (isBlackFive(card)) reasons.push('黑 5 免疫炸弹，是很好的安全顶牌');
    else if (card.rank === 5) reasons.push(`5 放上去后对手只能接 0，选择很少`);
    else if (card.rank === 0) reasons.push(`0 也是窄口牌，对手只有 1/2 两条路`);
    if (top) {
      const options = allowedRanksOn(top);
      if (options.length === 1) reasons.push(`当前顶端 ${top.rank} 本来就只有一条出路，出牌可以继续保持收紧`);
    }
  }

  if (hasPurpleLock(state)) reasons.push('当前有紫 0 限锁，只能出数字牌');
  if (state.hands[player].length === 1) reasons.push('这是最后一张手牌，出了就直接获胜');

  if (reasons.length === 0) reasons.push(`把 ${cardName(card)} 压到${colName}顶端 ${top ? top.rank : '空'} 上`);
  return reasons.join('；') + '。';
}

/** 给 UI 用的完整提示包。 */
function coach(state, player, searchConfig = DEFAULT_SEARCH) {
  const ranked = rankMoves(state, player, searchConfig).slice(0, 3);
  const best = ranked[0];
  return {
    best: best?.action ?? null,
    reason: best ? explainAction(state, best.action, player) : '当前没有可用着法',
    alternatives: ranked.slice(1).map((entry) => ({
      action: entry.action,
      text: entry.action.type === 'pass' ? '过牌' : `第 ${entry.action.col + 1} 列放 ${cardName(entry.action.card)}`,
    })),
    evaluation: best ? Math.round(best.score) : 0,
  };
}

/** 给 UI 用的局面评估条（-1 ~ 1，正数代表当前行动方占优）。 */
function advantage(state, player) {
  const raw = evaluate(state, player);
  return Math.max(-1, Math.min(1, raw / 40));
}

  const label = restriction.label ?? '限制';
  const who = forMe ? '你' : '对手';
  const parts = [];
  if (restriction.allowedColumns) {
    parts.push(`只能放第 ${restriction.allowedColumns.map((c) => c + 1).join('、')} 列`);
  }
  if (restriction.forbiddenColumns) {
    parts.push(`不能放第 ${restriction.forbiddenColumns.map((c) => c + 1).join('、')} 列`);
  }
  if (restriction.digitsOnly) parts.push('只能放数字牌');
  if (restriction.forbidKinds?.length) parts.push('不能放 E/M');
  if (restriction.forbidSkills) parts.push('不能使用主动技能');

    ? `（${restriction.exemptKinds.map((k) => (k === 'e' ? 'E' : 'M')).join('/')} 不受此限）`
    : '';
  return `${label}：本回合${who}${parts.join('，')}。${exempt}`;
